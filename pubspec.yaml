name: sistem_informasi_penjualan_wira_teknik
description: "Sistem Informasi Penjualan CV.Wira Teknik."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  fl_chart: ^1.2.0
  intl: ^0.19.0
  flutter:
    sdk: flutter
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  flutter_riverpod: ^3.3.1
  dart_jsonwebtoken: ^3.4.1
  file_picker: ^8.1.2
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.13.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/wira_teknik_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - .env

  fonts:
  - family: Poppins
    fonts:
      - asset: assets/fonts/poppins/Poppins-Thin.ttf
        weight: 100
      - asset: assets/fonts/poppins/Poppins-Light.ttf
        weight: 300
      - asset: assets/fonts/poppins/Poppins-Regular.ttf
        weight: 400
      - asset: assets/fonts/poppins/Poppins-Medium.ttf
        weight: 500
      - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/poppins/Poppins-Bold.ttf
        weight: 700
      - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
        weight: 800